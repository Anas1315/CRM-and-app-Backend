databases:
  - name: crm-database
    databaseName: crm
    user: crm_user
    plan: free

services:
  - type: web
    name: crm-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-database
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20

  - type: web
    name: crm-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: crm-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
